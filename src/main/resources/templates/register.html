<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS - Register</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-6 col-lg-4">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <h1 class="fw-bold">EMS</h1>
                        <p class="text-muted">
                            Employee Management System
                        </p>
                    </div>

                    <h4 class="text-center mb-4">
                        Create Account
                    </h4>

                    <form id="registerForm">

                        <div class="mb-3">
                            <label
                                    for="username"
                                    class="form-label">
                                Username
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    name="username"
                                    placeholder="Choose a username"
                                    required
                            >
                        </div>

                        <div class="mb-3">
                            <label
                                    for="password"
                                    class="form-label">
                                Password
                            </label>

                            <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Enter password"
                                    required
                            >
                        </div>

                        <div class="mb-3">
                            <label
                                    for="role"
                                    class="form-label">
                                Role
                            </label>

                            <select
                                    class="form-select"
                                    id="role"
                                    name="role">

                                <option value="USER">
                                    User
                                </option>

                                <option value="ADMIN">
                                    Admin
                                </option>

                            </select>
                        </div>

                        <button
                                type="submit"
                                class="btn btn-dark w-100">
                            Register
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0">
                            Already have an account?
                            <a href="/login">
                                Login
                            </a>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JavaScript -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
